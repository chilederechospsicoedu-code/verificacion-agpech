:root{--bg:#f2f4f9;--card:#fff;--ink:#0b1a38;--mut:#606881;--line:#dde2ee;--gold:#9a7b2f;--ok:#0a7a45;--okbg:#e4f5ec;--warn:#9a5b00;--warnbg:#fff1d9;--bad:#b3261e;--badbg:#fde8e6;--nav:#0b1a38;--on:#fff;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#0d1220;--card:#161c2e;--ink:#eef1f8;--mut:#9fa8c0;--line:#2a3350;--gold:#d6b45f;--ok:#58d79c;--okbg:#10382a;--warn:#ffc15e;--warnbg:#3a2a0c;--bad:#ff8f86;--badbg:#401a17;--nav:#0b1a38;--on:#0b1a14;color-scheme:dark}}
:root{box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh}
header{background:var(--nav);color:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) 18px 14px}
header .in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:12px}
header img{height:46px;width:auto;background:#fff;border-radius:10px;padding:3px}
header b{display:block;font-weight:800;letter-spacing:.08em}header span{font-size:12px;opacity:.8}
header a{color:inherit;text-decoration:none}
main{max-width:640px;margin:0 auto;padding:20px 16px 32px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px}
.badge{display:flex;align-items:center;gap:14px;border-radius:16px;padding:14px 16px;font-weight:800;font-size:19px}
.badge i{display:grid;place-items:center;flex:none;width:46px;height:46px;border-radius:50%;background:var(--st);color:var(--on);font-style:normal;font-size:24px;line-height:1}
.ok{background:var(--okbg);color:var(--ok);--st:var(--ok)}.warn{background:var(--warnbg);color:var(--warn);--st:var(--warn)}.bad{background:var(--badbg);color:var(--bad);--st:var(--bad)}
dl{margin:18px 0 0;display:grid;gap:14px}
dt{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);font-weight:800}
dd{margin:2px 0 0;font-size:17px;font-weight:600;overflow-wrap:anywhere}
dd.nm{font-size:22px;font-weight:800}
dd.mono{font-family:"AGP Mono",ui-monospace,Menlo,monospace;font-size:15px}
p.note{color:var(--mut);font-size:13px;margin:16px 0 0}
label{display:block;font-size:13px;font-weight:600;color:var(--mut);margin:14px 0 6px}
input,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:48px}
textarea{min-height:120px;font-size:13px}
button{font:inherit;font-weight:700;min-height:48px;padding:0 20px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;margin-top:12px}
button.p{background:var(--nav);border-color:var(--nav);color:#fff}
input:focus,textarea:focus,button:focus-visible{outline:2px solid #3b6fe0;outline-offset:2px}
h2{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin:0 0 6px}
footer{max-width:640px;margin:0 auto;padding:0 16px 28px;font-size:12px;color:var(--mut);text-align:center}
footer a{color:inherit}
.hide{display:none!important}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:s 1s linear infinite;margin:6px auto}
@keyframes s{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation:none}}
</style>

const keyOf=async(h,use)=>crypto.subtle.importKey('raw',await sha('key|'+h),'AES-GCM',false,[use]);
async function seal(h,obj){const iv=crypto.getRandomValues(new Uint8Array(12));
  const c=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},await keyOf(h,'encrypt'),enc.encode(JSON.stringify(obj))));
  return{iv:b64(iv),c:b64(c)}}
async function open(h,r){return JSON.parse(dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(r.iv)},await keyOf(h,'decrypt'),unb64(r.c))))}
const getHash=t=>{const m=String(t||'').match(/(?:hash=)?([0-9a-f]{20})(?![0-9a-f])/i);return m?m[1].toLowerCase():null};

let REG=null;
async function loadReg(){
  if(REG)return REG;
  try{const j=JSON.parse(document.getElementById('reg').textContent);REG={v:1,r:j.r||{},u:j.updated}}catch(e){REG=null}
  return REG;
}
const esc=(el,t)=>{el.textContent=t;return el};
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function field(dl,k,v,cls){const w=document.createElement('div');w.append(el('dt','',k),el('dd',cls||'',v));dl.append(w)}

function show(kind,title,icon,lines,data){
  const b=$('#box');b.textContent='';
  const bd=el('div','badge '+kind);bd.append(el('i','',icon),el('span','',title));b.append(bd);
  if(data){const dl=document.createElement('dl');
    if(data.n)field(dl,'Nombre',data.n,'nm');
    if(data.t)field(dl,'Título',data.t);
    field(dl,'Folio N°',data.f,'mono');
    if(data.d)field(dl,'Fecha de emisión',data.d);
    if(kind==='ok')field(dl,'Estado','Socio/a activo/a · válida para acceso a recursos, congresos y votación');
    b.append(dl)}
  for(const l of lines)b.append(el('p','note',l));
  if(data||kind==='bad')b.append(el('p','note','Consulta realizada el '+new Date().toLocaleString('es-CL',{dateStyle:'long',timeStyle:'short'})));
  $('#manual').classList.remove('hide');
}

async function verify(h){
  const box=$('#box');box.textContent='';box.append(Object.assign(el('div','spin'),{role:'status'}));
  if(!h){show('warn','Falta el código','ⓘ',['Escanea el QR de la credencial o pega abajo el enlace o el código.']);return}
  const reg=await loadReg();
  if(!reg){show('warn','Registro no disponible','⚠',['No se pudo cargar el registro de credenciales. Intenta nuevamente en unos minutos o escribe a AGPECH.']);return}
  const rec=reg.r[await idOf(h)];
  if(!rec){show('bad','Credencial no encontrada','✕',['El código no corresponde a ninguna credencial emitida por AGPECH. Si crees que es un error, contáctanos.']);return}
  let d;try{d=await open(h,rec)}catch(e){show('bad','Credencial no válida','✕',['El código no coincide con el registro.']);return}
  if((d.e||'vigente')==='vigente')show('ok','Credencial válida','✓',['Datos verificados en el registro oficial de AGPECH'+(reg.u?' · actualizado el '+new Date(reg.u).toLocaleDateString('es-CL',{dateStyle:'long'}):'')+'.'],d);
  else show('warn','Credencial no vigente','⚠',['Esta credencial fue revocada o ya no está vigente. Para más información contacta a AGPECH.'],{f:d.f});
}

const route=()=>verify(getHash(location.hash.slice(1))||getHash(new URLSearchParams(location.search).get('hash')));
addEventListener('hashchange',route);
$('#go').onclick=()=>{const h=getHash($('#code').value);if(!h){show('bad','Código no válido','✕',['El código debe tener 20 caracteres (letras a–f y números).']);return}
  try{history.replaceState(null,'','?hash='+h)}catch(e){}verify(h)};
$('#code').onkeydown=e=>{if(e.key==='Enter')$('#go').click()};
if(!(window.crypto&&crypto.subtle)){$('#box').textContent='Este navegador no permite la verificación segura. Abre la página con https://.'}else route();
})();
</script>
